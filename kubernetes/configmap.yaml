apiVersion: v1
kind: ConfigMap
metadata:
  name: prediction-api-config
  namespace: mlops-app
  labels:
    app.kubernetes.io/name: prediction-api
data:
  # Non-sensitive settings only. Pods read these at start (kubectl rollout restart to apply changes).
  LOG_LEVEL: "INFO"
  PREDICTION_THRESHOLD: "0.5"
  MODEL_DIR: "/app/model"
