apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-api
  namespace: mlops-app
  labels:
    app.kubernetes.io/name: prediction-api
    app.kubernetes.io/version: model-v8
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below 2 ready pods during an update
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-api
        app.kubernetes.io/version: model-v8
    spec:
      containers:
        - name: api
          image: prediction-api:model-v8
          imagePullPolicy: IfNotPresent   # image is built locally into colima's docker
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: prediction-api-config
          env:
            - name: APP_VERSION
              value: model-v8
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
