name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run --frozen ruff check .
      # Every external service (Gemini, MLflow, Airflow, Kubernetes) is mocked; no secrets needed.
      - name: Tests (pytest)
        run: uv run --frozen pytest -v
