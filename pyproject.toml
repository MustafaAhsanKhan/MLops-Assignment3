[project]
name = "mlops-agent"
version = "0.1.0"
description = "MLOps AI agent over DVC, MLflow, Airflow and Kubernetes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.67",
    "mlflow>=3.18",
    "scikit-learn",
    "pandas",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "kubernetes",
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit set so lint results don't shift with ruff's defaults. Blind excepts are deliberate at
# the tool boundary: a tool failure must become a reported error, never a crash or a guess.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["kubernetes"]  # the repo's kubernetes/ manifest folder is not a package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
