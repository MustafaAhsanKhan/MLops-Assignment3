[project]
name = "mlops-agent"
version = "0.1.0"
description = "MLOps AI agent over DVC, MLflow, Airflow and Kubernetes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dvc>=3.67",
    "mlflow>=3.18",
    "scikit-learn",
    "pandas",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "kubernetes",
    "google-genai",
    "pydantic>=2",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
